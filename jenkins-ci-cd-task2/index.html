<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Internship | Jenkins CI/CD Task 2</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 10%,#3e1b55,#15101b 65%);color:#fff;padding:24px}
    main{width:min(680px,100%);padding:clamp(28px,6vw,56px);border:1px solid #ffffff26;border-radius:22px;background:#ffffff0b;box-shadow:0 24px 80px #0007}
    .tag{display:inline-block;background:#ffaf6820;color:#ffb980;border:1px solid #ffaf6850;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.08em}
    h1{font-size:clamp(30px,5vw,54px);line-height:1.08;margin:25px 0 15px}
    h1 span{color:#ffb980}
    p{color:#dad1df;line-height:1.7;font-size:17px}
    .flow{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;align-items:center}
    .flow b{border-radius:9px;background:#ffffff15;padding:11px 15px;font-size:15px}
    .flow i{font-style:normal;color:#ffb980}
    footer{margin-top:35px;color:#bcb0c6;font-size:14px}
  </style>
</head>
<body>
  <main>
    <span class="tag">DEVOPS INTERNSHIP · TASK 2</span>

    <h1>Jenkins <span>CI/CD Pipeline</span></h1>

    <p>Version 2 — Successfully updated and automatically deployed using Jenkins CI/CD and Docker!</p>

    <div class="flow" aria-label="CI/CD flow">
      <b>GitHub</b>
      <i>→</i>
      <b>Jenkins</b>
      <i>→</i>
      <b>Docker</b>
      <i>→</i>
      <b>Deploy</b>
    </div>

    <footer>Automated Build · Test · Deploy</footer>
  </main>
</body>
</html>
